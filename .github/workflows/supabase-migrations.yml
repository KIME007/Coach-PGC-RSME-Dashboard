# Applies new SQL files in supabase/migrations to the Supabase project on every push to main.
# Needs one repository secret: SUPABASE_DB_URL — the "Session pooler" connection string
# from Supabase → Connect, with your database password filled in.
name: Update Supabase tables

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the secret is set
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - name: Apply new tables to Supabase
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
